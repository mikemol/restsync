name: ci

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # Allow-listed actions: actions/checkout, jdx/mise-action
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8
      - name: Install toolchain
        run: mise install
      - name: Create venv
        run: |
          mise exec -- python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies (dev)
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]
      - name: Policy check (workflows)
        run: .venv/bin/python scripts/policy_check.py --workflows
      - name: Docflow audit
        run: .venv/bin/python -m gabion docflow-audit --root . --fail-on-violations
      - name: Check plan (read-only)
        env:
          RESTSYNC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/plan_runs
          .venv/bin/restsync check --config configs/restsync.yml --output artifacts/plan_runs/plan.json
      - name: Tests
        run: |
          mkdir -p artifacts/test_runs
          .venv/bin/python -m pytest \
            --junitxml artifacts/test_runs/junit.xml \
            --log-file artifacts/test_runs/pytest.log \
            --log-file-level=INFO
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-runs
          path: artifacts/test_runs
      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-runs
          path: artifacts/plan_runs
