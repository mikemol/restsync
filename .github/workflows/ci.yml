name: ci

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # Allow-listed actions: actions/checkout, actions/setup-python
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.8"
      - name: Create venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies (dev)
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]
      - name: Run checks
        run: scripts/checks.sh
      - name: Check plan (read-only)
        env:
          RESTSYNC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/plan_runs
          .venv/bin/restsync check \
            --config configs/restsync.yml \
            --baseline baselines/overlay_baseline.json \
            --output artifacts/plan_runs/plan.json \
            --metrics artifacts/plan_runs/metrics.json
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-runs
          path: artifacts/test_runs
      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-runs
          path: artifacts/plan_runs
      - name: Upload dataflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dataflow-report
          path: artifacts/audit_reports
