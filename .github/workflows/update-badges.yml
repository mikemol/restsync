name: update-badges

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # Allow-listed actions: actions/checkout, actions/setup-python
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.8"
      - name: Create venv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - name: Update badge JSON
        env:
          RESTSYNC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESTSYNC_BIN: ${{ github.workspace }}/.venv/bin/restsync
        run: scripts/update_badges.sh
      - name: Commit badge update
        run: |
          if git diff --quiet -- docs/badges/plan-health.json; then
            echo "No badge changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/plan-health.json
          git commit -m "Update plan health badge"
          git push
