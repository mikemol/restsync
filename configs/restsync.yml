version: 1
provider: github
overlay: overlays/github.yml
repo:
  owner: mikemol
  name: restsync
base_url: https://api.github.com
auth:
  mode: gh

desired:
  actions_permissions:
    enabled: true
    allowed_actions: selected
    sha_pinning_required: true
  selected_actions:
    github_owned_allowed: true
    verified_allowed: false
    patterns_allowed:
      - actions/checkout
      - actions/download-artifact
      - actions/upload-artifact
  workflow_permissions:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
  branch_main_protection:
    required_status_checks:
      strict: true
      contexts:
        - audit
        - dataflow-grammar
    required_pull_request_reviews: null
    restrictions: null
    required_signatures: false
    enforce_admins: true
    required_linear_history: false
    allow_force_pushes: false
    allow_deletions: false
    block_creations: false
    required_conversation_resolution: true
    lock_branch: false
    allow_fork_syncing: false
  branch_stage_protection:
    required_status_checks: null
    required_pull_request_reviews: null
    restrictions: null
    required_signatures: false
    enforce_admins: false
    required_linear_history: false
    allow_force_pushes: false
    allow_deletions: false
    block_creations: false
    required_conversation_resolution: true
    lock_branch: false
    allow_fork_syncing: false

endpoints:
  - name: actions_permissions
    method: GET
    url: /repos/{owner}/{repo}/actions/permissions
    compare:
      include:
        - enabled
        - allowed_actions
        - sha_pinning_required
      ignore:
        - url
    apply:
      method: PUT
      url: /repos/{owner}/{repo}/actions/permissions
      body_from: desired.actions_permissions

  - name: selected_actions
    method: GET
    url: /repos/{owner}/{repo}/actions/permissions/selected-actions
    compare:
      include:
        - github_owned_allowed
        - verified_allowed
        - patterns_allowed
    apply:
      method: PUT
      url: /repos/{owner}/{repo}/actions/permissions/selected-actions
      body_from: desired.selected_actions

  - name: workflow_permissions
    method: GET
    url: /repos/{owner}/{repo}/actions/permissions/workflow
    compare:
      include:
        - default_workflow_permissions
        - can_approve_pull_request_reviews
      ignore:
        - url
    apply:
      method: PUT
      url: /repos/{owner}/{repo}/actions/permissions/workflow
      body_from: desired.workflow_permissions

  - name: branch_main_protection
    method: GET
    url: /repos/{owner}/{repo}/branches/main/protection
    allow_not_found: true
    compare:
      include:
        - required_status_checks
        - required_signatures
        - enforce_admins
        - required_linear_history
        - allow_force_pushes
        - allow_deletions
        - block_creations
        - required_conversation_resolution
        - lock_branch
        - allow_fork_syncing
      ignore:
        - url
        - contexts_url
        - checks
      sort:
        - contexts
      unwrap_enabled:
        - required_signatures
        - enforce_admins
        - required_linear_history
        - allow_force_pushes
        - allow_deletions
        - block_creations
        - required_conversation_resolution
        - lock_branch
        - allow_fork_syncing
    apply:
      method: PUT
      url: /repos/{owner}/{repo}/branches/main/protection
      body_from: desired.branch_main_protection

  - name: branch_stage_protection
    method: GET
    url: /repos/{owner}/{repo}/branches/stage/protection
    allow_not_found: true
    compare:
      include:
        - required_status_checks
        - required_signatures
        - enforce_admins
        - required_linear_history
        - allow_force_pushes
        - allow_deletions
        - block_creations
        - required_conversation_resolution
        - lock_branch
        - allow_fork_syncing
      ignore:
        - url
        - contexts_url
        - checks
      sort:
        - contexts
      unwrap_enabled:
        - required_signatures
        - enforce_admins
        - required_linear_history
        - allow_force_pushes
        - allow_deletions
        - block_creations
        - required_conversation_resolution
        - lock_branch
        - allow_fork_syncing
    apply:
      method: PUT
      url: /repos/{owner}/{repo}/branches/stage/protection
      body_from: desired.branch_stage_protection
